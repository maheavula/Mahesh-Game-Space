<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070B17" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="#070B17"/>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="350" r="250" fill="url(#glow)" filter="url(#blur)"/>
  <!-- Decorative Futuristic Shapes -->
  <polygon points="300,120 480,240 480,480 300,600 120,480 120,240" fill="none" stroke="#C084FC" stroke-width="2" stroke-opacity="0.3"/>
  <polygon points="300,160 440,260 440,460 300,560 160,460 160,260" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="10 5"/>
  <circle cx="300" cy="360" r="90" fill="none" stroke="#C084FC" stroke-width="3" stroke-opacity="0.6"/>
  <!-- Gaming Monogram Icon -->
  <path d="M 270 340 L 330 340 M 300 310 L 300 370 M 345 350 A 10 10 0 1 1 345 349 M 375 370 A 10 10 0 1 1 375 369" stroke="#A855F7" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Overlay Glass Gradient Card Bottom -->
  <rect x="30" y="600" width="540" height="160" rx="20" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
  
  <!-- Text Metadata -->
  <rect x="50" y="625" width="130" height="26" rx="6" fill="#C084FC" fill-opacity="0.3" stroke="#C084FC" stroke-opacity="0.6"/>
  <text x="115" y="642" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#A855F7" text-anchor="middle" letter-spacing="1.5">HERO SHOOTER</text>
  
  <text x="50" y="690" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="0.5">APEX LEGENDS</text>
  <text x="50" y="730" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94A3B8">MAHESH GAME SPACE SIMULATOR</text>
</svg>